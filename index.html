<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Solar System Explorer</title>

<style>
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  background: #0b0f1a;
  color: white;
  font-family: Arial;
}

header, footer {
  background: #111827;
  padding: 10px 20px;
}

main { flex: 1; display: flex; }

aside {
  width: 260px;
  background: #1f2937;
  padding: 15px;
}

section { flex: 1; position: relative; }

.panel {
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 15px;
}

#infoPanel {
  position: absolute;
  bottom: 20px;
  left: 20px;
  max-width: 260px;
  line-height: 1.4em;
  font-size: 13px;
}
</style>
</head>

<body>

<header><h2>Solar System Explorer</h2></header>

<main>
<aside>

<div class="panel">
<h3>Controls</h3>

<label><input type="checkbox" id="toggleOrbits" checked> Show Orbits</label><br>
<label><input type="checkbox" id="pauseSystem"> Pause</label>

<hr>

<b>Speed</b><br>
<input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1">
<div id="speedValue">1x</div>

<button onclick="setSpeed(0.25)">0.25x</button>
<button onclick="setSpeed(0.5)">0.5x</button>
<button onclick="setSpeed(1)">1x</button>
<button onclick="setSpeed(2)">2x</button>

</div>

<div class="panel">
<h3>Info</h3>
<p>Click any object to display info about it</p>
</div>

</aside>

<section id="sceneContainer">
<div id="infoPanel" class="panel" style="display:none;"></div>
</section>

</main>

<footer><small>Three.js Simulation</small></footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180/examples/jsm/controls/OrbitControls.js';

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 5000);
camera.position.z = 180;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const container = document.getElementById("sceneContainer");
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

// TEXTURES
const loader = new THREE.TextureLoader();
const textures = {
  sun: loader.load('./Textures/2k_sun.jpg'),
  mercury: loader.load('./Textures/2k_mercury.jpg'),
  venus: loader.load('./Textures/2k_venus_atmosphere.jpg'),
  earth: loader.load('./Textures/earth_atmos_2048.jpg'),
  moon: loader.load('./Textures/moon_1024.jpg'),
  mars: loader.load('./Textures/2k_mars.jpg'),
  jupiter: loader.load('./Textures/2k_jupiter.jpg'),
  saturn: loader.load('./Textures/2k_saturn.jpg'),
  uranus: loader.load('./Textures/2k_uranus.jpg'),
  neptune: loader.load('./Textures/2k_neptune.jpg'),
  pluto: loader.load('./Textures/2k_pluto.jpg'),

  // MOONS
  io: loader.load('./Textures/2k_io.jpg'),
  europa: loader.load('./Textures/2k_europa.jpg'),
  callisto: loader.load('./Textures/2k_callisto.jpg'),
  phobos: loader.load('./Textures/2k_phobos.jpg'),
  deimos: loader.load('./Textures/2k_deimos.jpg'),
  ganymede: loader.load('./Textures/ganymede.png'),

  // BACKGROUND
  stars: loader.load('./Textures/StarryBackgroundwMilkyWay.jpg'),

  // SATURN RING
  saturnRing: loader.load('./Textures/2k_saturn_ring_alpha.png')
};

Object.values(textures).forEach(t => t.colorSpace = THREE.SRGBColorSpace);

//planet info dictionary
const planetInfo = {
  Sun: {
    type: "Star",
    radius: "696,340 km",
    temp: "5,500°C (surface)",
    fact: "Contains 99.8% of the Solar System's mass"
  },
  Mercury: {
    type: "Rock Planet",
    radius: "2,440 km",
    day: "59 Earth days",
    fact: "Closest planet to the Sun"
  },
  Venus: {
    type: "Rock Planet",
    radius: "6,052 km",
    day: "243 Earth days",
    fact: "Hottest planet due to thick CO₂ atmosphere that increases sun heat"
  },
  Earth: {
    type: "Rock Planet",
    radius: "6,371 km",
    day: "24 hours",
    fact: "Our home planet. Only known planet with life"
  },
  Mars: {
    type: "Planet",
    radius: "3,390 km",
    day: "24.6 hours",
    fact: "The red planet. The high concentration of iron oxide on its surface is what gives it its red color"
  },
  Jupiter: {
    type: "Gas Giant",
    radius: "69,911 km",
    day: "10 hours",
    fact: "Largest planet in the Solar System and its spinning is the fastest due to its gas structure"
  },
  Saturn: {
    type: "Gas Giant",
    radius: "58,232 km",
    day: "10.7 hours",
    fact: "Famous for its visually appealing ring system"
  },
  Uranus: {
    type: "Ice Giant",
    radius: "25,362 km",
    day: "17 hours",
    fact: "Rotates on its side (98° tilt)"
  },
  Neptune: {
    type: "Ice Giant",
    radius: "24,622 km",
    day: "16 hours",
    fact: "Strongest winds in the Solar System. The methane in its atmosphere is what gives it its blue color"
  },
  Pluto: {
    type: "Dwarf Planet",
    radius: "1,188 km",
    day: "153 hours",
    fact: "Orbits in a highly elliptical path, was considered a planet long ago."
  }
};

//moons info dictionary
const moonInfo = {
  Moon: {
    parent: "Earth",
    radius: "1,737 km",
    fact: "Earth's only natural satellite. Stabilizes Earth's rotation and influences tidal waves."
  },
  Phobos: {
    parent: "Mars",
    radius: "11 km",
    fact: "Orbits Mars in just 7 hours. Symbolizes fear"
  },
  Deimos: {
    parent: "Mars",
    radius: "6 km",
    fact: "Smaller and smoother than Phobos. Symbolizes dread."
  },
  Io: {
    parent: "Jupiter",
    radius: "1,821 km",
    fact: "Most volcanically active body"
  },
  Europa: {
    parent: "Jupiter",
    radius: "1,560 km",
    fact: "Subsurface ocean may exist underneath its atmosphere"
  },
  Ganymede: {
    parent: "Jupiter",
    radius: "2,634 km",
    fact: "Largest moon in the Solar System"
  },
  Callisto: {
    parent: "Jupiter",
    radius: "2,410 km",
    fact: "Heavily cratered surface"
  }
};

//BACKGROUND
scene.background = textures.stars;

//LIGHT
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
scene.add(new THREE.PointLight(0xffffff, 2.5, 2000));

//SUN
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(10,64,64),
  new THREE.MeshBasicMaterial({ map: textures.sun })
);
sun.userData.name = "Sun";
scene.add(sun);

// STORAGE
const planets = [];
const moons = [];
const orbitRings = [];
const clickable = [sun];

// ORBITS
function orbit(a,b){
  const curve = new THREE.EllipseCurve(0,0,a,b);
  const pts = curve.getPoints(100);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const line = new THREE.LineLoop(geo,new THREE.LineBasicMaterial({color:0xffffff,opacity:0.3,transparent:true}));
  line.rotation.x = Math.PI/2;
  scene.add(line);
  orbitRings.push(line);
}

// PLANET
function planet(name,size,a,b,speed,tex){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(size,64,64),
    new THREE.MeshStandardMaterial({ map: tex })
  );
  m.userData.name = name;
  scene.add(m);
  clickable.push(m);

  planets.push({m,a,b,speed,angle:Math.random()*Math.PI*2});
  orbit(a,b);
  return m;
}

// MOON
function moon(parent,size,dist,speed,tex,name){
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(size,32,32),
    new THREE.MeshStandardMaterial({ map: tex })
  );
  m.userData.name = name;
  parent.add(m);
  clickable.push(m);

  moons.push({m,dist,speed,angle:0});
}

// CREATE PLANETS
const mercury = planet("Mercury", 1, 15, 13, 0.02, textures.mercury);
const venus   = planet("Venus", 1.5, 25, 23, 0.015, textures.venus);

const earth   = planet("Earth", 3, 40, 38, 0.01, textures.earth);
const mars    = planet("Mars", 2, 55, 50, 0.008, textures.mars);

const jupiter = planet("Jupiter", 6, 85, 80, 0.005, textures.jupiter);
const saturn  = planet("Saturn", 5, 115, 110, 0.004, textures.saturn);
const uranus  = planet("Uranus", 4, 140, 135, 0.003, textures.uranus);
const neptune = planet("Neptune", 4, 165, 160, 0.0025, textures.neptune);

// 🪐 PLUTO (eccentric orbit)
const pluto = planet("Pluto", 0.8, 210, 140, 0.002, textures.pluto);

// 🌙 MOONS (FIXED TEXTURES)
moon(earth, 1, 6, 0.05, textures.moon, "Moon");

moon(mars, 0.5, 4, 0.06, textures.phobos, "Phobos");
moon(mars, 0.4, 6, 0.04, textures.deimos, "Deimos");

moon(jupiter, 1, 10, 0.03, textures.io, "Io");
moon(jupiter, 1.2, 14, 0.025, textures.europa, "Europa");
moon(jupiter, 1.3, 18, 0.02, textures.ganymede, "Ganymede");
moon(jupiter, 1.1, 22, 0.018, textures.callisto, "Callisto");

// 🪐 SATURN RINGS (FIX)
const ringGeo = new THREE.RingGeometry(6, 10, 64);
const ringMat = new THREE.MeshBasicMaterial({
  map: textures.saturnRing,
  side: THREE.DoubleSide,
  transparent: true
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
saturn.add(ring);

// UI
document.getElementById("toggleOrbits").onchange=e=>{
  orbitRings.forEach(o=>o.visible=e.target.checked);
};

let paused=false;
document.getElementById("pauseSystem").onchange=e=>paused=e.target.checked;

// SPEED
let speedMultiplier = 1;

window.setSpeed = v=>{
  speedMultiplier = v;
  document.getElementById("speedSlider").value = v;
  document.getElementById("speedValue").innerText = v+"x";
};

document.getElementById("speedSlider").oninput = e=>{
  speedMultiplier = parseFloat(e.target.value);
  document.getElementById("speedValue").innerText = speedMultiplier.toFixed(1)+"x";
};

// CLICK
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const panel = document.getElementById("infoPanel");

container.addEventListener("click", e=>{
  const rect = renderer.domElement.getBoundingClientRect();

  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(clickable, true);

  if(hits.length>0){
    const name = hits[0].object.userData.name;
    panel.style.display="block";
    let info = planetInfo[name] || moonInfo[name];

    if(info){
      panel.innerHTML = `
        <b>${name}</b><br>
        ${Object.entries(info).map(([k,v]) => `<b>${k}:</b> ${v}`).join("<br>")}`;
    }
    else{
  panel.innerHTML = `<b>${name}</b><br>No data available`;
    }
  }
});

// ANIMATION
function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if(!paused){
    planets.forEach(p=>{
      p.angle += p.speed * speedMultiplier;
      p.m.position.x = Math.cos(p.angle)*p.a;
      p.m.position.z = Math.sin(p.angle)*p.b;
    });

    moons.forEach(m=>{
      m.angle += m.speed * speedMultiplier;
      m.m.position.x = Math.cos(m.angle)*m.dist;
      m.m.position.z = Math.sin(m.angle)*m.dist;
    });
  }

  renderer.render(scene,camera);
}
animate();

// RESIZE
addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
